name: CI

on:
  push:
  pull_request:

jobs:

  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend_project

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend_project/requirements.txt') }}

      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest

      - name: Run backend smoke tests
        run: pytest tests/ -v


  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend_project

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend_project/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test

      - name: Type-check
        run: pnpm exec tsc --noEmit
